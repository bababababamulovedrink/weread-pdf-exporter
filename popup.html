<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeRead PDF 导出</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    .header {
      background: #2b8a3e;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg { flex-shrink: 0; }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    .body { padding: 14px 16px; }

    .book-title {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
      min-height: 32px;
      display: flex;
      align-items: center;
    }
    .book-title span { flex: 1; word-break: break-all; }

    .progress-area {
      margin-bottom: 14px;
      display: none;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    .progress-bar-wrap {
      background: #eee;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar {
      background: #2b8a3e;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
      border-radius: 4px;
    }

    .status-msg {
      font-size: 12px;
      color: #777;
      margin-bottom: 14px;
      min-height: 18px;
      line-height: 1.5;
    }
    .status-msg.error { color: #c0392b; }
    .status-msg.success { color: #2b8a3e; }

    .btn {
      display: block;
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s, background 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #2b8a3e; color: white; margin-bottom: 8px; }
    .btn-primary:hover:not(:disabled) { background: #237032; }
    .btn-secondary { background: #1a73e8; color: white; margin-bottom: 8px; }
    .btn-secondary:hover:not(:disabled) { background: #1557b0; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover:not(:disabled) { background: #c0392b; }

    .divider { height: 1px; background: #eee; margin: 12px 0; }

    .tips {
      font-size: 11px;
      color: #999;
      line-height: 1.6;
      padding-top: 4px;
    }
    .tips li { margin-left: 14px; margin-bottom: 2px; }

    #stopBtn { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <div>
      <div class="header-title">WeRead PDF 导出</div>
      <div class="header-sub">微信读书 → PDF</div>
    </div>
  </div>

  <div class="body">
    <div class="book-title">
      <span id="bookTitle">正在检测书籍…</span>
    </div>

    <div class="progress-area" id="progressArea">
      <div class="progress-label">
        <span>采集进度</span>
        <span id="progressText">0 页</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="status-msg" id="statusMsg">请在微信读书中打开一本书，再点击开始导出。</div>

    <button class="btn btn-primary" id="startBtn">开始导出</button>
    <button class="btn btn-danger" id="stopBtn">停止</button>
    <button class="btn btn-secondary" id="pdfBtn" disabled>生成 PDF（打印保存）</button>

    <div class="divider"></div>
    <ul class="tips">
      <li>请确保书籍已打开并处于阅读页面</li>
      <li>导出时请勿手动操作页面</li>
      <li>点击"生成 PDF"后文件将自动下载到本地</li>
      <li>生成时间取决于书籍长度，请耐心等待</li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
